<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>CineLab – Film Study Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b0c10;--bg2:#14161d;--bg3:#1d202a;--tx:#e8e6e1;--mu:#8d93a3;--ac:#e0a43a;--bd:#2a2e3a;--v:#4fb286;--r:#5b9bd5;--ai:#b07ae0;--u:#e0a43a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#1d1a2b,var(--bg));color:var(--tx);font:15px/1.55 Georgia,'Times New Roman',serif;min-height:100vh}
h1,h2,h3,button,input,select,textarea,.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);background:#0b0c10ee;backdrop-filter:blur(8px);z-index:5}
.logo{font:700 20px system-ui;letter-spacing:.14em;color:var(--ac)}nav{display:flex;gap:6px;flex-wrap:wrap}
button,.btn{background:var(--bg3);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#111;border-color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:18px}
input,select,textarea{background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px;max-width:100%}
textarea{width:100%;min-height:70px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card.m{cursor:pointer;border-top:3px solid var(--c,var(--ac))}.card.m:hover{transform:translateY(-2px);border-color:var(--ac)}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font:11px system-ui;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin:2px 3px 2px 0}
.chip.sel{background:var(--ac);color:#111;border-color:var(--ac);cursor:pointer}.chip.pick{cursor:pointer;font-size:12px;padding:4px 10px}
.tag{font:700 10px system-ui;letter-spacing:.06em;padding:2px 6px;border-radius:4px;margin-right:6px;color:#111;white-space:nowrap}
.tV{background:var(--v)}.tR{background:var(--r)}.tAI{background:var(--ai)}.tU{background:var(--u)}
h2{font-size:22px;margin:6px 0 12px}h3{font-size:15px;margin:16px 0 6px;color:var(--ac);text-transform:uppercase;letter-spacing:.08em}
table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px;vertical-align:top}
.bar{height:10px;background:var(--bg3);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#e06c3a)}
.tl{position:relative;height:46px;background:var(--bg3);border-radius:8px;margin:10px 0;overflow:hidden}
.tl b{position:absolute;top:6px;width:6px;height:34px;border-radius:3px;background:var(--ac);cursor:pointer}.tl b:hover{background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:720px){.two{grid-template-columns:1fr}}
.stars span{cursor:pointer;font-size:22px;color:#444}.stars span.f{color:var(--ac)}
.legend{font:12px system-ui;color:var(--mu)}label.ck{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.spoil{filter:blur(6px);cursor:pointer}.spoil.show{filter:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.hide{display:none}
</style></head><body>
<header><div class="logo">▣ CINELAB</div><nav id="nav"></nav><input id="q" placeholder="Search film, director, cast, crew…" style="flex:1;min-width:180px"></header>
<main id="app"></main>
<script>
const F=[
{id:'parasite',t:'Parasite',y:2019,d:'Bong Joon-ho',lang:'Korean',g:['Thriller','Dark Comedy'],mood:['tense','darkly funny'],th:['class','deception','space'],rt:132,cast:['Song Kang-ho','Choi Woo-shik','Park So-dam','Cho Yeo-jeong','Lee Sun-kyun'],crew:{Cinematography:'Hong Kyung-pyo',Editing:'Yang Jin-mo',Music:'Jung Jae-il','Production design':'Lee Ha-jun'},log:'A struggling family schemes its way into the lives of a wealthy household.',spoil:'The plot pivots on a hidden basement and a violent collision of the two households at a garden party.',st:{Cinematography:'Vertical staging (up/down) turns architecture into class geography.',Color:'Clean, bright upper-class home vs. murky, damp lower spaces.',Editing:'Smooth tonal shifts; crosscuts compare the two homes.',Sound:'Restrained score; rain and silence build pressure.',Design:'A built set house designed to control sightlines and stairs.'},ds:'Genre-blending with precise blocking and social allegory.',mo:['stairs','rain','the scholar\'s stone'],cr:'#4fb286'},
{id:'br2049',t:'Blade Runner 2049',y:2017,d:'Denis Villeneuve',lang:'English',g:['Sci-Fi','Neo-noir'],mood:['contemplative','melancholic'],th:['identity','memory','what is real'],rt:164,cast:['Ryan Gosling','Harrison Ford','Ana de Armas','Jared Leto'],crew:{Cinematography:'Roger Deakins',Editing:'Joe Walker',Music:'Hans Zimmer, Benjamin Wallfisch','Production design':'Dennis Gassner'},log:'A young blade runner uncovers a secret that could upend society.',spoil:'The protagonist\'s belief that he is special is overturned.',st:{Cinematography:'Wide, symmetrical frames with small figures against vast spaces.',Color:'Monochrome washes: orange haze, cold grey, sickly yellow.',Editing:'Slow, patient cutting that lets spaces breathe.',Sound:'Low, heavy synth textures and sudden drones.',Design:'Brutalist, monumental architecture signalling power.'},ds:'Atmosphere-first, patient pacing, scale as emotion.',mo:['eyes','snow/ash','holograms'],cr:'#e0763a'},
{id:'itmfl',t:'In the Mood for Love',y:2000,d:'Wong Kar-wai',lang:'Cantonese',g:['Romance','Drama'],mood:['yearning','romantic'],th:['restraint','longing','memory'],rt:98,cast:['Tony Leung','Maggie Cheung'],crew:{Cinematography:'Christopher Doyle, Mark Lee Ping-bin',Editing:'William Chang','Production design':'William Chang',Music:'Michael Galasso, Shigeru Umebayashi'},log:'Two neighbours in 1960s Hong Kong grow close after suspecting their spouses.',spoil:'Their feelings are never fully consummated; a secret is whispered into a wall.',st:{Cinematography:'Doorways, mirrors and narrow corridors frame characters as confined.',Color:'Saturated reds and greens, cheongsam patterns.',Editing:'Elliptical repetition of small routines; slow motion.',Sound:'A recurring waltz motif returns across scenes.',Design:'Wallpaper, lamps and cramped apartments as emotional pressure.'},ds:'Fragmented time, mood over plot, obstructed framing.',mo:['cheongsam','stairs at night','smoke'],cr:'#c0392b'},
{id:'pulp',t:'Pulp Fiction',y:1994,d:'Quentin Tarantino',lang:'English',g:['Crime','Dark Comedy'],mood:['cool','darkly funny'],th:['chance','redemption','violence'],rt:154,cast:['John Travolta','Samuel L. Jackson','Uma Thurman','Bruce Willis'],crew:{Cinematography:'Andrzej Sekuła',Editing:'Sally Menke'},log:'Intertwined stories of criminals in Los Angeles told out of order.',spoil:'The non-linear order lets a character appear after seemingly dying.',st:{Cinematography:'Long dialogue takes, low angles, trunk-view shots.',Color:'Warm saturated primaries.',Editing:'Chapter structure; time shuffled for meaning.',Sound:'Needle-drop soundtrack drives mood.',Design:'Diners, apartments as stages for talk.'},ds:'Dialogue-led scenes, pop-culture collage, chaptered structure.',mo:['briefcase','food','pop songs'],cr:'#e0b73a'},
{id:'spirited',t:'Spirited Away',y:2001,d:'Hayao Miyazaki',lang:'Japanese',g:['Animation','Fantasy'],mood:['wondrous','gentle'],th:['growing up','identity','greed'],rt:125,cast:['Rumi Hiiragi (voice)','Miyu Irino (voice)'],crew:{Music:'Joe Hisaishi',Studio:'Studio Ghibli'},log:'A girl enters a spirit world and must work in a bathhouse to free her parents.',spoil:'Names and memory are key to freeing oneself.',st:{Cinematography:'Hand-drawn layouts with deep background detail.',Color:'Lush painted palettes shifting between calm and unease.',Editing:'Quiet "ma" pauses between action.',Sound:'Piano-led themes plus ambient detail.',Design:'Layered bathhouse architecture.'},ds:'Hand-drawn animation, pauses, nature and moral ambiguity.',mo:['trains','water','names'],cr:'#3a9be0'},
{id:'2001',t:'2001: A Space Odyssey',y:1968,d:'Stanley Kubrick',lang:'English',g:['Sci-Fi'],mood:['awe','cold'],th:['evolution','technology','the unknown'],rt:149,cast:['Keir Dullea','Gary Lockwood'],crew:{Cinematography:'Geoffrey Unsworth'},log:'Humanity\'s journey from prehistory to deep space.',spoil:'The ship\'s computer turns on the crew.',st:{Cinematography:'Symmetric one-point perspective, long takes.',Color:'Sterile whites and saturated reds.',Editing:'Match cuts across millennia.',Sound:'Classical music and long silences.',Design:'Pioneering spaceship interiors.'},ds:'Visual storytelling with minimal dialogue; precision.',mo:['monolith','circles','red light'],cr:'#9aa4b8'},
{id:'samurai',t:'Seven Samurai',y:1954,d:'Akira Kurosawa',lang:'Japanese',g:['Action','Drama'],mood:['epic','human'],th:['duty','class','community'],rt:207,cast:['Toshiro Mifune','Takashi Shimura'],crew:{Cinematography:'Asakazu Nakai',Music:'Fumio Hayasaka'},log:'Villagers hire samurai to defend them from bandits.',spoil:'Most of the samurai die; the villagers prevail.',st:{Cinematography:'Telephoto compression; weather as emotion.',Color:'Black-and-white contrast with mud and rain.',Editing:'Rhythmic cuts with movement wipes.',Sound:'Taiko drumming and ambient rain.',Design:'Practical, lived-in village sets.'},ds:'Dynamic movement, ensemble staging, weather.',mo:['rain','banners','wind'],cr:'#888'},
{id:'moonlight',t:'Moonlight',y:2016,d:'Barry Jenkins',lang:'English',g:['Drama'],mood:['tender','quiet'],th:['identity','masculinity','belonging'],rt:111,cast:['Trevante Rhodes','Mahershala Ali','Naomie Harris'],crew:{Cinematography:'James Laxton',Editing:'Nat Sanders, Joi McMillon',Music:'Nicholas Britell'},log:'Three chapters in one man\'s life in Miami.',spoil:'He reconnects with his childhood friend as an adult.',st:{Cinematography:'Intimate close-ups and fluid camera.',Color:'Saturated blues and pinks.',Editing:'Chapter structure with elliptical gaps.',Sound:'Chopped-and-screwed strings and silence.',Design:'Real Miami locations.'},ds:'Intimate subjectivity, sensory image-making.',mo:['water','faces','blue'],cr:'#3a6ee0'}];
const M={Cinematography:'Cinematography',Color:'Color & lighting',Editing:'Editing',Sound:'Sound & music',Design:'Production design'};
const EX=['Watch one scene with sound off; list the shot types.','Sketch a floor plan of one scene and mark where the camera sits.','Note every cut in 2 minutes and what each one achieves.','Write what the colour palette tells you about the character.'];
let S={w:{},seen:{},r:{},n:{},ck:{},sh:{},ex:{}};try{S=Object.assign(S,JSON.parse(localStorage.getItem('cl')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cl',JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);const get=id=>F.find(f=>f.id==id);
const tag=(k)=>({V:'<span class="tag tV">VERIFIED</span>',R:'<span class="tag tR">REPORTED</span>',AI:'<span class="tag tAI">AI INTERPRETATION</span>',U:'<span class="tag tU">YOUR NOTE</span>'}[k]);
let view='dash',cur=null,pick={g:[],mood:[],th:[]},filt={g:'',l:'',e:''},open={};
const dec=y=>Math.floor(y/10)*10+'s';
function nav(){const v=[['dash','Dashboard'],['rec','For You'],['browse','Browse'],['crew','People'],['study','Film Study']];$('nav').innerHTML=v.map(a=>`<button class="${view==a[0]?'on':''}" onclick="go('${a[0]}')">${a[1]}</button>`).join('')}
function go(v,id){view=v;cur=id||cur;nav();render();scrollTo(0,0)}
function mc(f,extra=''){return `<div class="card m" style="--c:${f.cr}" onclick="go('film','${f.id}')"><b class="sans">${esc(f.t)}</b> <span class="mu">${f.y}</span><div class="mu">${esc(f.d)} · ${f.lang}</div><div>${f.g.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="mu" style="margin-top:6px">${esc(f.log)}</div>${extra}<div class="mu" style="margin-top:6px">${S.w[f.id]?'★ Watchlist ':''}${S.seen[f.id]?'✓ Watched ':''}${S.r[f.id]?'· '+S.r[f.id]+'/5':''}</div></div>`}
function dash(){const n=F.length,w=Object.keys(S.w).length,s=Object.keys(S.seen).length;const ex=Object.values(S.ex).reduce((a,o)=>a+Object.values(o).filter(Boolean).length,0),tot=n*EX.length;
const rated=Object.entries(S.r);const avg=rated.length?(rated.reduce((a,b)=>a+b[1],0)/rated.length).toFixed(1):'–';
return `<h2>Your film lab</h2><div class="grid"><div class="card"><div class="mu">Watched</div><h2>${s}/${n}</h2><div class="bar"><i style="width:${s/n*100}%"></i></div></div><div class="card"><div class="mu">Watchlist</div><h2>${w}</h2></div><div class="card"><div class="mu">Avg. rating</div><h2>${avg}</h2></div><div class="card"><div class="mu">Study exercises done</div><h2>${ex}/${tot}</h2><div class="bar"><i style="width:${ex/tot*100}%"></i></div></div></div>
<h3>Watchlist</h3><div class="grid">${F.filter(f=>S.w[f.id]).map(f=>mc(f)).join('')||'<span class="mu">Nothing yet. Open a film and tap “Add to watchlist”.</span>'}</div>
<h3>Viewing history</h3><div class="grid">${F.filter(f=>S.seen[f.id]).map(f=>mc(f)).join('')||'<span class="mu">No films marked watched.</span>'}</div>
<p class="legend">Labels used throughout: ${tag('V')}credit/year (high confidence, still check official sources) ${tag('R')}commonly reported (e.g. runtime; varies by cut) ${tag('AI')}analysis, one reading among many ${tag('U')}what you write.</p>`}
function chips(k,vals){return vals.map(v=>`<span class="chip pick ${pick[k].includes(v)?'sel':''}" onclick="tg('${k}','${v.replace(/'/g,"\\'")}')">${v}</span>`).join('')}
function tg(k,v){const a=pick[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);render()}
function rec(){const all=k=>[...new Set(F.flatMap(f=>f[k]))];
const liked=F.filter(f=>S.r[f.id]>=4);
const sc=F.map(f=>{let s=0,why=[];[['g','genre'],['mood','mood'],['th','theme']].forEach(([k,l])=>f[k].forEach(x=>{if(pick[k].includes(x)){s+=2;why.push(`${l}: ${x}`)}}));
liked.forEach(l=>{if(l.id==f.id)return;if(l.d==f.d){s+=2;why.push(`same director as ${l.t}, which you rated ${S.r[l.id]}`)}else{const sh=l.g.filter(x=>f.g.includes(x));if(sh.length){s+=1;why.push(`shares ${sh[0]} with ${l.t} (rated ${S.r[l.id]})`)}}});
if(S.seen[f.id])s-=5;return{f,s,why}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
return `<h2>Recommendations for you</h2><div class="card"><div class="mu">Choose what you’re in the mood for. Your 4–5★ ratings also steer results.</div><h3>Genre</h3>${chips('g',all('g'))}<h3>Mood</h3>${chips('mood',all('mood'))}<h3>Theme</h3>${chips('th',all('th'))}</div><br>
<div class="grid">${sc.map(x=>mc(x.f,`<div style="margin-top:8px">${tag('AI')}<span class="mu">Why: ${esc(x.why.join('; '))}.</span></div>`)).join('')||'<span class="mu">Pick a few tags or rate films to get suggestions.</span>'}</div>
<p class="legend">Matching is a transparent tag-overlap engine over this built-in catalogue, not a live LLM call.</p>`}
function browse(){const q=$('q').value.toLowerCase();
const list=F.filter(f=>{const hay=[f.t,f.d,...f.cast,...Object.values(f.crew),...f.g,...f.th,...f.mood].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!filt.g||f.g.includes(filt.g))&&(!filt.l||f.lang==filt.l)&&(!filt.e||dec(f.y)==filt.e)});
const opt=(k,vals,l)=>`<select onchange="filt.${k}=this.value;render()"><option value="">${l}</option>${vals.map(v=>`<option ${filt[k]==v?'selected':''}>${v}</option>`).join('')}</select>`;
return `<h2>Browse & search</h2><div class="row">${opt('g',[...new Set(F.flatMap(f=>f.g))],'Genre')}${opt('l',[...new Set(F.map(f=>f.lang))],'Language')}${opt('e',[...new Set(F.map(f=>dec(f.y)))].sort(),'Era')}</div><br><div class="grid">${list.map(f=>mc(f)).join('')||'<span class="mu">No matches.</span>'}</div>
<p class="legend">The catalogue holds ${F.length} starter films; extend the F array for more.</p>`}
function crew(){const q=$('q').value.toLowerCase();const P={};
F.forEach(f=>{(P[f.d]=P[f.d]||[]).push(['Director',f]);Object.entries(f.crew).forEach(([r,names])=>names.split(', ').forEach(n=>(P[n]=P[n]||[]).push([r,f])));f.cast.forEach(n=>(P[n]=P[n]||[]).push(['Cast',f]))});
const rows=Object.keys(P).sort().filter(n=>!q||n.toLowerCase().includes(q));
return `<h2>People database</h2><div class="card"><table><tr><th>Name</th><th>Credits in catalogue</th></tr>${rows.map(n=>`<tr><td>${esc(n)}</td><td>${P[n].map(([r,f])=>`<a href="#" style="color:var(--ac)" onclick="go('film','${f.id}');return false">${esc(f.t)}</a> <span class="mu">(${r})</span>`).join(', ')}</td></tr>`).join('')}</table></div><p class="legend">Key credits only. Complete crew lists are not included; consult the film’s official credits, AFI or IMDb.</p>`}
function stars(id){return `<div class="stars">${[1,2,3,4,5].map(i=>`<span class="${S.r[id]>=i?'f':''}" onclick="S.r['${id}']=${S.r[id]==i?0:i};save();render()">★</span>`).join('')}</div>`}
function film(){const f=get(cur);const sh=(S.sh[f.id]=S.sh[f.id]||[]);const ck=(S.ck[f.id]=S.ck[f.id]||[{t:'Watch once without notes',d:0},{t:'Rewatch focusing on one craft element',d:0}]);
const spoil=open[f.id+'s'];
return `<button onclick="go('browse')">← Back</button><h2>${esc(f.t)} <span class="mu">${f.y}</span></h2>
<div class="row"><button class="${S.w[f.id]?'on':''}" onclick="S.w['${f.id}']=!S.w['${f.id}'];save();render()">${S.w[f.id]?'On watchlist':'Add to watchlist'}</button><button class="${S.seen[f.id]?'on':''}" onclick="S.seen['${f.id}']=!S.seen['${f.id}'];save();render()">${S.seen[f.id]?'✓ Watched':'Mark watched'}</button>${stars(f.id)}</div>
<div class="two"><div class="card"><h3>Overview</h3>${tag('V')}<span class="mu">${esc(f.d)} · ${f.lang} · ${f.g.join(', ')}</span><p>${tag('AI')}${esc(f.log)}</p><div>${f.th.map(x=>`<span class="chip">${x}</span>`).join('')}</div>
<h3>Full analysis</h3><button onclick="open['${f.id}s']=!open['${f.id}s'];render()">${spoil?'Hide':'Reveal'} spoilers</button><p class="${spoil?'':'hide'}">${tag('AI')}${esc(f.spoil)}</p>
<h3>Motifs & themes</h3><p>${tag('AI')}Recurring: ${f.mo.map(esc).join(', ')}.</p></div>
<div class="card"><h3>Cast</h3>${tag('V')}${f.cast.map(esc).join(', ')}<h3>Key crew</h3>${tag('V')}<table>${Object.entries(f.crew).map(([r,n])=>`<tr><td>${r}</td><td>${esc(n)}</td></tr>`).join('')}</table><p class="mu">Runtime ${tag('R')}~${f.rt} min (varies by cut). Full crew not listed here.</p></div></div>
<div class="card" style="margin-top:14px"><h3>Director & style</h3><p>${tag('AI')}<b>${esc(f.d)}</b>: ${esc(f.ds)}</p><h3>Craft analysis</h3><table>${Object.entries(f.st).map(([k,v])=>`<tr><td>${M[k]}</td><td>${tag('AI')}${esc(v)}</td></tr>`).join('')}</table>
<p class="mu">Lens, aperture and exact shot data are not published here; add them yourself if you find reliable sources.</p></div>
<div class="card" style="margin-top:14px"><h3>Movie → Act → Sequence → Scene → Shot → Frame</h3><p class="mu">Timestamps are never guessed. Log what you observe while watching; entries land on the timeline.</p>
<div class="tl">${sh.map((s,i)=>`<b style="left:${Math.min(98,s.m/f.rt*100)}%" title="${esc(s.ts)} ${esc(s.type)}" onclick="open.shot=${i};render()"></b>`).join('')}</div>
<div class="row sans" style="font-size:12px"><input id="s_ts" placeholder="mm:ss" size="6"><input id="s_ac" placeholder="Act" size="6"><input id="s_sq" placeholder="Sequence" size="10"><input id="s_sc" placeholder="Scene" size="10"><select id="s_ty"><option>Wide</option><option>Medium</option><option>Close-up</option><option>Extreme close-up</option><option>Over-the-shoulder</option><option>POV</option><option>Insert</option></select><select id="s_an"><option>Eye level</option><option>Low angle</option><option>High angle</option><option>Dutch</option></select><select id="s_mv"><option>Static</option><option>Pan</option><option>Tilt</option><option>Dolly</option><option>Handheld</option><option>Crane</option><option>Zoom</option></select></div>
<div class="row" style="margin:6px 0"><input id="s_nt" placeholder="Composition, lighting, colour, sound, edit, narrative purpose…" style="flex:1;min-width:200px"><button onclick="addShot('${f.id}')">Add shot</button></div>
<div style="overflow-x:auto"><table><tr><th>Time</th><th>Act › Seq › Scene</th><th>Shot</th><th>Observation</th><th></th></tr>${[...sh].map((s,i)=>[s,i]).sort((a,b)=>a[0].m-b[0].m).map(([s,i])=>`<tr ${open.shot===i?'style="background:var(--bg3)"':''}><td>${esc(s.ts)}</td><td>${[s.ac,s.sq,s.sc].map(esc).join(' › ')}</td><td>${esc(s.type)} · ${esc(s.an)} · ${esc(s.mv)}</td><td>${tag('U')}${esc(s.nt)}</td><td><button onclick="S.sh['${f.id}'].splice(${i},1);save();render()">✕</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">No shots logged.</td></tr>'}</table></div>
<h3>Frame analysis</h3><p class="mu">No frames are bundled. Load a screenshot from your device to annotate it (stays on your device).</p><input type="file" accept="image/*" onchange="fr(this)"><div id="fr"></div></div>
<div class="two" style="margin-top:14px"><div class="card"><h3>Checklist</h3>${ck.map((c,i)=>`<label class="ck"><input type="checkbox" ${c.d?'checked':''} onchange="S.ck['${f.id}'][${i}].d=this.checked?1:0;save();render()"> ${esc(c.t)}</label>`).join('')}<div class="row"><input id="ckn" placeholder="Add item" style="flex:1"><button onclick="if($('ckn').value){S.ck['${f.id}'].push({t:$('ckn').value,d:0});save();render()}">Add</button></div></div>
<div class="card"><h3>Your notes & review</h3><textarea placeholder="Write your review…" oninput="S.n['${f.id}']=this.value;save()">${esc(S.n[f.id]||'')}</textarea></div></div>`}
function addShot(id){const ts=$('s_ts').value.trim(),p=ts.split(':').map(Number);if(p.some(isNaN)||!ts)return alert('Enter timestamp as mm:ss or h:mm:ss');const m=p.length==3?p[0]*60+p[1]+p[2]/60:p[0]+(p[1]||0)/60;
S.sh[id].push({ts,m,ac:$('s_ac').value,sq:$('s_sq').value,sc:$('s_sc').value,type:$('s_ty').value,an:$('s_an').value,mv:$('s_mv').value,nt:$('s_nt').value});save();render()}
function fr(el){const r=new FileReader();r.onload=()=>{$('fr').innerHTML=`<img src="${r.result}" style="max-width:100%;border-radius:8px;margin:8px 0"><div class="mu">Checklist: subject placement · lines/depth · light direction · palette · what the frame withholds.</div><textarea placeholder="Your frame notes"></textarea>`};if(el.files[0])r.readAsDataURL(el.files[0])}
function study(){return `<h2>Film Study Mode</h2><p class="mu">Learn one craft idea per film, then do the exercises. Progress is saved on your device.</p><div class="grid">${F.map(f=>{const o=S.ex[f.id]||{},d=EX.filter((_,i)=>o[i]).length;const k=Object.keys(f.st)[F.indexOf(f)%5];return `<div class="card"><b class="sans">${esc(f.t)}</b><div class="mu">Focus: ${M[k]}</div><p>${tag('AI')}${esc(f.st[k])}</p>${EX.map((e,i)=>`<label class="ck"><input type="checkbox" ${o[i]?'checked':''} onchange="(S.ex['${f.id}']=S.ex['${f.id}']||{})[${i}]=this.checked;save();render()"> <span style="font-size:13px">${e}</span></label>`).join('')}<div class="bar"><i style="width:${d/EX.length*100}%"></i></div><br><button onclick="go('film','${f.id}')">Open film</button></div>`}).join('')}</div>`}
function render(){const v={dash,rec,browse,crew,study,film}[view];$('app').innerHTML=v()}
$('q').addEventListener('input',()=>{if(view!='crew'&&view!='browse'){view='browse';nav()}render()});
nav();render();
</script></body></html>
